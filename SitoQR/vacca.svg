<svg id="vacca" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 235 145" width="176" height="112">
  <g fill="#383737">
    <!-- corpo: dorso piatto (senza gobba, a differenza del bufalo) -->
    <rect x="38" y="42" width="126" height="52" rx="17"/>
    <!-- collo -->
    <rect x="150" y="33" width="21" height="35" rx="8"/>
    <!-- testa -->
    <ellipse cx="191" cy="54" rx="21" ry="25"/>
    <!-- muso largo (caratteristica delle bovine) -->
    <rect x="202" y="57" width="21" height="17" rx="7"/>
    <!-- orecchio -->
    <ellipse cx="175" cy="33" rx="7" ry="12" transform="rotate(-20 175 33)"/>
    <!-- corno: curvatura verso l'alto (non verso il basso come nel bufalo) -->
    <path d="M175,27 C169,13 176,3 184,6 C188,10 185,20 179,26 Z"/>
    <!-- arti posteriori (coppia) -->
    <rect x="52"  y="87" width="12" height="44" rx="5"/>
    <rect x="70"  y="87" width="12" height="44" rx="5"/>
    <!-- arti anteriori (coppia) -->
    <rect x="126" y="87" width="12" height="44" rx="5"/>
    <rect x="144" y="87" width="12" height="44" rx="5"/>
    <!-- mammella -->
    <ellipse cx="97" cy="100" rx="18" ry="11"/>
    <!-- coda con fiocco terminale -->
    <path d="M40,62 Q16,44 22,22 Q25,10 32,14 Q38,20 34,30 Q28,46 40,66 Z"/>
  </g>
</svg>
